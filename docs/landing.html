<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gnumaru's Painting and Animation App Manual</title>
    <script>
      // Send readers straight to their language; the chooser below stays
      // as a fallback (and for crawlers) when JavaScript is off.
      try {
        var lang = (navigator.language || "en").toLowerCase();
        window.location.replace(lang.indexOf("pt") === 0 ? "pt_BR/" : "en/");
      } catch (e) {
        /* fall through to the manual chooser */
      }
    </script>
    <style>
      body { font-family: sans-serif; background: #fcfcfc; color: #222; margin: 4em auto; max-width: 40em; padding: 0 1em; text-align: center; }
      h1 { font-size: 1.6em; }
      a { display: inline-block; margin: 1em; font-size: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Gnumaru's Painting and Animation App Manual</h1>
    <p><a href="en/">English manual</a><a href="pt_BR/">Manual em português</a></p>
  </body>
</html>
